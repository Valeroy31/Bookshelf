<svg width="160" height="32" viewBox="0 0 160 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bookshelf logo">
  <title>Bookshelf</title>
  <!-- Left page -->
  <path d="M 3 5 C 3 3 5 2 8 2 L 14 2 L 14 30 L 8 30 C 5 30 3 28 3 25 Z" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.55)" stroke-width="1.2"/>
  <!-- Right page -->
  <path d="M 29 5 C 29 3 27 2 24 2 L 18 2 L 18 30 L 24 30 C 27 30 29 28 29 25 Z" fill="rgba(255,255,255,0.20)" stroke="rgba(255,255,255,0.55)" stroke-width="1.2"/>
  <!-- Spine -->
  <rect x="13.5" y="2" width="5" height="28" fill="rgba(255,255,255,0.20)"/>
  <!-- Text lines left page -->
  <line x1="6" y1="11" x2="12" y2="11" stroke="rgba(255,255,255,0.35)" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="6" y1="15" x2="12" y2="15" stroke="rgba(255,255,255,0.35)" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="6" y1="19" x2="10" y2="19" stroke="rgba(255,255,255,0.35)" stroke-width="1.1" stroke-linecap="round"/>
  <!-- Text lines right page -->
  <line x1="20" y1="11" x2="26" y2="11" stroke="rgba(255,255,255,0.35)" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="20" y1="15" x2="26" y2="15" stroke="rgba(255,255,255,0.35)" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="20" y1="19" x2="24" y2="19" stroke="rgba(255,255,255,0.35)" stroke-width="1.1" stroke-linecap="round"/>
  <!-- Bookmark -->
  <path d="M 22 2 L 27 2 L 27 10 L 24.5 8 L 22 10 Z" fill="#FBBF24"/>
  <!-- Wordmark -->
  <text x="40" y="22" font-family="system-ui,-apple-system,BlinkMacSystemFont,sans-serif" font-weight="700" font-size="17" fill="#FFFFFF" letter-spacing="-0.4">book</text>
  <text x="79" y="22" font-family="system-ui,-apple-system,BlinkMacSystemFont,sans-serif" font-weight="700" font-size="17" fill="#A78BDF" letter-spacing="-0.4">shelf</text>
</svg>
